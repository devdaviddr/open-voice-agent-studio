[project]
name = "ovas-core"
version = "0.3.0"
description = "Shared domain models, validation and workflow engine for Open Voice Agent Studio"
requires-python = ">=3.12"
dependencies = [
    "cel-python>=0.5.0",
    "pydantic>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ovas_core"]
