[project]
name = "ovas-runtime"
version = "0.2.0"
description = "Session runtime for Open Voice Agent Studio"
requires-python = ">=3.12"
dependencies = [
    "ovas-core",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.29.0",
]

[tool.uv.sources]
ovas-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ovas_runtime"]
