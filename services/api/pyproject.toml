[project]
name = "ovas-api"
version = "0.2.0"
description = "Control-plane API for Open Voice Agent Studio"
requires-python = ">=3.12"
dependencies = [
    "ovas-core",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.29.0",
    "pydantic-settings>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.45",
    "asyncpg>=0.31.0",
    "alembic>=1.17.0",
    "pgvector>=0.4.2",
    "argon2-cffi>=25.1.0",
    "pydantic[email]>=2.14.4",
]

[tool.uv.sources]
ovas-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ovas_api"]
