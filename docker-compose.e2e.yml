# End-to-end stack: `make e2e`. Adds the scripted stub LLM and starts only what the browser test
# needs (no TTS or STT models to download). Host ports are configurable so it can run beside a
# development stack: E2E_WEB_PORT (default 5173).
services:
  stub-llm:
    build: { context: ., dockerfile: services/runtime/Dockerfile }
    command: ["uv", "run", "--no-sync", "uvicorn", "--app-dir", "services/runtime/tests", "stub_llm:app", "--host", "0.0.0.0", "--port", "8200"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 2s
      retries: 30

  api:
    ports: !reset []
    environment:
      OVAS_DEFAULT_LLM_URL: http://stub-llm:8200/v1
      OVAS_DEFAULT_LLM_MODEL: stub
      OVAS_ALLOWED_ORIGINS: '["http://localhost:${E2E_WEB_PORT:-5173}"]'
    depends_on:
      stub-llm: { condition: service_healthy }

  runtime:
    ports: !reset []
    environment:
      OVAS_DEFAULT_LLM_URL: http://stub-llm:8200/v1
      OVAS_DEFAULT_LLM_MODEL: stub

  web:
    ports: !override ["${E2E_WEB_PORT:-5173}:5173"]
