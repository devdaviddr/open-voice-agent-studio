# Open Voice Agent Studio — development stack. `make up` (or `docker compose up --build`).
x-python: &python
  environment: &pyenv
    OVAS_DATABASE_URL: postgresql+asyncpg://ovas:ovas@db:5432/ovas
    OVAS_RUNTIME_URL: http://runtime:8100
    OVAS_TTS_URL: http://tts-kokoro:8002
    OVAS_STT_URL: http://stt-whisper:8003
    OVAS_API_URL: http://api:8000
    # Development-only keys. Set your own in .env for anything shared (see .env.example).
    OVAS_SECRET_KEY: ${OVAS_SECRET_KEY:-dev-secret-key-change-me}
    OVAS_INTERNAL_KEY: ${OVAS_INTERNAL_KEY:-dev-internal-key-change-me}
    # Default LLM: Ollama on the host machine. Change per workspace in Settings.
    OVAS_DEFAULT_LLM_URL: ${OVAS_DEFAULT_LLM_URL:-http://host.docker.internal:11434/v1}
    OVAS_DEFAULT_LLM_MODEL: ${OVAS_DEFAULT_LLM_MODEL:-qwen3.5:9b}

services:
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["5173:5173"]
    environment:
      OVAS_API_URL: http://api:8000
      OVAS_RUNTIME_URL: http://runtime:8100
      VITE_POLL: "1"
    volumes:  # live reload of the studio source in development
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
    depends_on: [api]

  api:
    <<: *python
    build: { context: ., dockerfile: services/api/Dockerfile }
    ports: ["8000:8000"]
    environment:
      <<: *pyenv
      OVAS_EMBEDDING_CACHE_DIR: /models/embeddings
    volumes:
      - embedding-models:/models  # knowledge embeddings model, downloaded on first index
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db: { condition: service_healthy }

  runtime:
    <<: *python
    build: { context: ., dockerfile: services/runtime/Dockerfile }
    ports: ["8100:8100"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  tts-kokoro:
    build: { context: ., dockerfile: providers/tts-kokoro/Dockerfile }
    ports: ["8002:8002"]
    volumes:
      - kokoro-models:/models

  stt-whisper:
    build: { context: ., dockerfile: providers/stt-whisper/Dockerfile }
    ports: ["8003:8003"]
    environment:
      OVAS_WHISPER_MODEL: ${OVAS_WHISPER_MODEL:-base}
    volumes:
      - whisper-models:/models

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ovas
      POSTGRES_PASSWORD: ovas
      POSTGRES_DB: ovas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovas"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Throwaway database for `make test`; data lives in memory.
  db-test:
    image: pgvector/pgvector:pg17
    profiles: [test]
    environment:
      POSTGRES_USER: ovas
      POSTGRES_PASSWORD: ovas
      POSTGRES_DB: ovas_test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovas"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  kokoro-models:
  whisper-models:
  embedding-models:
