# Open Voice Agent Studio — development stack. `make up` (or `docker compose up --build`).
x-python: &python
  environment: &pyenv
    OVAS_DATABASE_URL: postgresql+asyncpg://ovas:ovas@db:5432/ovas
    OVAS_RUNTIME_URL: http://runtime:8100
    OVAS_TTS_URL: http://tts-kokoro:8002

services:
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["5173:5173"]
    environment:
      OVAS_API_URL: http://api:8000
      VITE_POLL: "1"
    volumes:  # live reload of the studio source in development
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
    depends_on: [api]

  api:
    <<: *python
    build: { context: ., dockerfile: services/api/Dockerfile }
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  runtime:
    <<: *python
    build: { context: ., dockerfile: services/runtime/Dockerfile }
    ports: ["8100:8100"]

  tts-kokoro:
    build: { context: ., dockerfile: providers/tts-kokoro/Dockerfile }
    ports: ["8002:8002"]
    volumes:
      - kokoro-models:/models

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ovas
      POSTGRES_PASSWORD: ovas
      POSTGRES_DB: ovas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovas"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Throwaway database for `make test`; data lives in memory.
  db-test:
    image: pgvector/pgvector:pg17
    profiles: [test]
    environment:
      POSTGRES_USER: ovas
      POSTGRES_PASSWORD: ovas
      POSTGRES_DB: ovas_test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovas"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  kokoro-models:
