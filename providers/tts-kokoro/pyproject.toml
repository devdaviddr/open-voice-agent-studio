[project]
name = "ovas-tts-kokoro"
version = "0.1.0"
description = "Kokoro-82M text-to-speech service for Open Voice Agent Studio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "kokoro-onnx==0.6.1",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ovas_tts_kokoro"]

