[project]
name = "ovas-stt-whisper"
version = "0.1.0"
description = "Whisper speech-to-text service for Open Voice Agent Studio"
requires-python = ">=3.12"
dependencies = [
    "av<19",  # faster-whisper 1.2.1 passes metadata_errors, which PyAV 19 removed
    "fastapi>=0.165.0",
    "faster-whisper>=1.1",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ovas_stt_whisper"]
