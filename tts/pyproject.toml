[project]
name = "tts"
version = "0.1.0"
description = "Kokoro-82M text-to-speech service for Open Voice Agent Studio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "kokoro-onnx==0.6.1",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tts"]

[tool.ruff]
line-length = 100
