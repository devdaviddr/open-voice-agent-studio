[tool.uv.workspace]
members = ["packages/core", "services/api", "services/runtime", "providers/tts-kokoro"]

[tool.uv.sources]
ovas-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.17.6",
    "pyright>=1.1.408",
    "httpx>=0.29.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["packages/core/src", "services/api/src", "services/runtime/src", "providers/tts-kokoro/src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["packages", "services", "providers", "scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff.lint.isort]
known-first-party = ["ovas_core", "ovas_api", "ovas_runtime", "ovas_tts_kokoro"]
